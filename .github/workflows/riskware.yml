name: RiskwareSupplyChain Scan

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grepstrength/riskware-action@v1
        with:
          api-key: ${{ secrets.RSC_API_KEY }}
